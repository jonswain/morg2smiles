# The 1M shard at 8,508 steps, to de-confound the middle of the scaling curve.
#
# The fixed-compute comparison wants three shard sizes all trained for 8,508
# steps: 100k (configs/small.yaml, already on disk), 1M (this run) and the full
# corpus (configs/small_full.yaml). The 1M point could in principle be read off
# the existing small_1m curve at step 8,508, but that run's cosine schedule was
# set for 21,117 steps, so at step 8,508 its learning rate was still high and it
# is not comparable with runs whose schedule completed. A 3.2 h run removes the
# confound rather than apologising for it in a footnote.
shard_dir: data/shards/1m
out_dir: checkpoints/small_1m_matched

fingerprint:
  radius: 2
  n_bits: 2048
  counts: false
  folded: true

model:
  d_model: 256
  n_heads: 8
  d_ff: 1024
  n_encoder_layers: 4
  n_decoder_layers: 4
  dropout: 0.1
  max_tokens: 128

train:
  # 900,917 / 128 = 7,039 steps per epoch, so 8,508 lands early in epoch 2.
  epochs: 2
  batch_size: 128
  lr: 0.0005
  warmup_steps: 300
  randomize_smiles: true
  eval_every_steps: 1500
  eval_n: 500
  eval_k: 20
  valid_loss_n: 2000
  patience: 0
  # Matched to configs/small.yaml's 12 epochs x 709 steps.
  max_steps: 8508
  max_hours: 4.5

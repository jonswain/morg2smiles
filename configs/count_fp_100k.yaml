# Count fingerprints, the cheap signal (next-steps-2026-10-13, item 3).
#
# Identical to small.yaml -- 100k shard, 8M parameters, 12 epochs, 8,508
# steps -- except counts: true. Counts carry strictly more information than
# bits, so this is the input-representation side of the failure analysis: if
# recovery jumps, the bottleneck is the input; if not, it is the model.
#
# Read against small_100k on the common protocol. The oracle for this model
# demands an exact *count* match, a stricter target, so the comparison also
# reports its candidates judged under the binary fingerprint.
shard_dir: data/shards/100k
out_dir: checkpoints/count_fp_100k

fingerprint:
  radius: 2
  n_bits: 2048
  counts: true
  folded: true

model:
  d_model: 256
  n_heads: 8
  d_ff: 1024
  n_encoder_layers: 4
  n_decoder_layers: 4
  dropout: 0.1
  max_tokens: 128

train:
  epochs: 12
  batch_size: 128
  lr: 0.0005
  warmup_steps: 300
  randomize_smiles: true
  eval_every_steps: 2127
  eval_n: 500
  eval_k: 20
  valid_loss_n: 2000
  patience: 0
  max_steps: 8508
  max_hours: 4.0

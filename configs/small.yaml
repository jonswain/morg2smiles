# A 10M-parameter run on the 100k shard: the fastest config that can plausibly
# show real learning (~2-3 h on an M2, against ~13 h for base.yaml).
# Use this to confirm the learning signal before committing to a long run.
shard_dir: data/shards/100k
out_dir: checkpoints/small

fingerprint:
  radius: 2
  n_bits: 2048
  counts: false
  folded: true

model:
  d_model: 256
  n_heads: 8
  d_ff: 1024
  n_encoder_layers: 4
  n_decoder_layers: 4
  dropout: 0.1
  max_tokens: 128

train:
  epochs: 12
  batch_size: 128
  lr: 0.0005
  warmup_steps: 300
  randomize_smiles: true
  eval_every: 2
  eval_n: 500
  eval_k: 20
  patience: 4

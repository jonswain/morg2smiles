# Smoke-test config: proves the whole pipeline end to end in a few minutes.
# Too small to recover much; its job is to fail fast when something is broken.
shard_dir: data/shards/10k
out_dir: checkpoints/tiny

fingerprint:
  radius: 2
  n_bits: 2048
  counts: false
  folded: true

model:
  d_model: 128
  n_heads: 4
  d_ff: 512
  n_encoder_layers: 2
  n_decoder_layers: 2
  dropout: 0.1
  max_tokens: 128

train:
  epochs: 3
  batch_size: 64
  lr: 0.0005
  warmup_steps: 50
  randomize_smiles: true
  eval_every: 1
  eval_n: 100
  eval_k: 20
  patience: 0

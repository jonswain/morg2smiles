# The constant-epoch corpus point (next-steps-2026-10-13, item 5).
#
# At a fixed step budget, steps x batch = corpus x passes is an identity, so
# corpus size and repetition cannot be separated -- which is why night 2's
# data-scaling fit was withdrawn. Holding *passes* fixed instead asks the corpus
# question honestly. small_1m is already 3 epochs (21,117 steps on 909,800
# molecules); this is the same 3 epochs on the 100k shard: 709 x 3 = 2,127
# steps. The full-ChEMBL weekend run at 44,112 steps is the third point.
#
# Identical to small_1m.yaml in architecture and optimiser. The cosine horizon
# is the epoch total, 2,127, so max_steps and horizon agree.
shard_dir: data/shards/100k
out_dir: checkpoints/small_100k_3ep

fingerprint:
  radius: 2
  n_bits: 2048
  counts: false
  folded: true

model:
  d_model: 256
  n_heads: 8
  d_ff: 1024
  n_encoder_layers: 4
  n_decoder_layers: 4
  dropout: 0.1
  max_tokens: 128

train:
  epochs: 3
  batch_size: 128
  lr: 0.0005
  warmup_steps: 300
  randomize_smiles: true
  eval_every_steps: 709
  eval_n: 500
  eval_k: 20
  valid_loss_n: 2000
  patience: 0
  max_steps: 2127
  max_hours: 1.5

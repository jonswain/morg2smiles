# Seed 2 of the size-weighted mix. See configs/size_mix_s1.yaml for the
# experiment and for why it needs two seeds: the between-seed sd in the 30-39
# heavy-atom band is 1.84 points, so one run cannot carry the comparison.
#
# Paired with configs/variance_s2.yaml, which shares its seed and therefore its
# initialisation, and differs only in the sampler.
shard_dir: data/shards/100k
out_dir: checkpoints/size_mix_s2

fingerprint:
  radius: 2
  n_bits: 2048
  counts: false
  folded: true

model:
  d_model: 256
  n_heads: 8
  d_ff: 1024
  n_encoder_layers: 4
  n_decoder_layers: 4
  dropout: 0.1
  max_tokens: 128

train:
  seed: 2
  epochs: 12
  batch_size: 128
  lr: 0.0005
  warmup_steps: 300
  randomize_smiles: true
  eval_every_steps: 2127
  eval_n: 500
  eval_k: 20
  valid_loss_n: 2000
  patience: 0
  max_steps: 8508
  max_hours: 3.6
  # The whole experiment. Weighted sampling draws with replacement, so the
  # epoch length and therefore the step schedule are unchanged.
  size_weight_threshold: 30
  size_weight_factor: 3.0

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GPU wheels are ~2.5 GB and CI only runs tests
          # that need a few forward passes on tiny tensors.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest ruff

      - name: Lint
        run: ruff check src tests scripts

      - name: Format
        run: ruff format --check src tests scripts

      - name: Test
        # The tests that need a prepared ChEMBL shard skip themselves when the
        # data is absent, so CI stays hermetic and offline.
        run: pytest -q

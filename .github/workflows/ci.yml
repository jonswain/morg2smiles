name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned rather than ubuntu-latest: the latest label migrates to Ubuntu 26
    # from 2026-10-19, and this repo compares numbers across weeks, so the CI
    # image should not change underneath a comparison without a commit saying so.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the GPU wheels are ~2.5 GB and CI only runs tests
          # that need a few forward passes on tiny tensors.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # ruff is pinned: `format --check` is a gate, and its output changes
          # between releases, so an unpinned formatter can turn CI red with no
          # code change. Bump it deliberately, in a commit.
          pip install -e . pytest 'ruff==0.16.10'

      - name: Lint
        run: ruff check src tests scripts

      - name: Format
        run: ruff format --check src tests scripts

      - name: Test
        # The tests that need a prepared ChEMBL shard skip themselves when the
        # data is absent, so CI stays hermetic and offline.
        run: pytest -q

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Morg2SMILES: a one-way function run backwards">
  <style>
    .s { stroke: #334155 }  .fs { fill: #334155 }
    .t { stroke: #0d9488 }  .ft { fill: #0d9488 }
    .a { stroke: #f59e0b }  .fa { fill: #f59e0b }
    .off { fill: none; stroke: #94a3b8 }
    @media (prefers-color-scheme: dark) {
      .s { stroke: #cbd5e1 } .fs { fill: #cbd5e1 }
      .t { stroke: #2dd4bf } .ft { fill: #2dd4bf }
      .a { stroke: #fbbf24 } .fa { fill: #fbbf24 }
      .off { stroke: #475569 }
    }
  </style>
  <!-- Hashing runs one way. This arc runs the other way, anticlockwise,
       back from the bits to the structure they came from.

       Geometry is computed, not eyeballed: the head sits tangent to the
       circle at 35 deg, the stroke stops 8 units short of the head's
       base so its round cap is swallowed rather than bulging past it, and
       the arc's own radius is adjusted to land on that shortened point. An
       earlier version had the head pointing 53 deg off tangent, which read
       as a pennant rather than an arrowhead. -->
  <g class="t" fill="none" stroke-width="18" stroke-linecap="round">
    <path d="M393.6 159.6 A168.2 168.2 0 1 0 389.0 358.9"/>
  </g>
  <path class="ft" d="M438.4 288.5 L426.4 375.3 L360.9 329.4 Z"/>
  <!-- the structure it arrives at -->
  <g class="a" fill="none" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="256.0,172.0 328.7,214.0 328.7,298.0 256.0,340.0 183.3,298.0 183.3,214.0"/>
    <circle cx="256" cy="256" r="38" stroke-width="12" opacity="0.5"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Morg2SMILES: fingerprint ridges resolving into a molecule">
  <style>
    .t { stroke: #0d9488 } .ft { fill: #0d9488 }
    .a { stroke: #f59e0b } .fa { fill: #f59e0b }
    @media (prefers-color-scheme: dark) {
      .t { stroke: #2dd4bf } .ft { fill: #2dd4bf }
      .a { stroke: #fbbf24 } .fa { fill: #fbbf24 }
    }
  </style>
  <!-- A fingerprint in the other sense. Nested elliptical ridges wrap 220
       degrees and stop; where the whorl would close, a molecule takes over. -->
  <g class="t" fill="none" stroke-width="15" stroke-linecap="round">
    <path d="M110 312 A154 180 0 1 1 402 312"/>
    <path d="M147 297 A116 136 0 1 1 365 297"/>
    <path d="M183 281 A78 92 0 1 1 329 281"/>
    <path d="M220 266 A40 48 0 1 1 292 266"/>
  </g>
  <!-- the ridge core becomes the first bond -->
  <g class="a" fill="none" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 268 L256 344"/>
    <path d="M256 344 L190 382"/>
    <path d="M256 344 L322 382"/>
    <path d="M190 382 L124 344"/>
    <path d="M322 382 L388 344"/>
  </g>
  <g class="fa">
    <circle cx="256" cy="344" r="19"/>
    <circle cx="190" cy="382" r="19"/>
    <circle cx="322" cy="382" r="19"/>
    <circle cx="124" cy="344" r="16"/>
    <circle cx="388" cy="344" r="16"/>
  </g>
</svg>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morg2smiles"
version = "0.1.0"
description = "Generative recovery of SMILES strings from Morgan (ECFP) fingerprints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "rdkit>=2024.3",
    "torch>=2.4",
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
    "click",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "matplotlib"]

[project.scripts]
morg2smiles = "morg2smiles.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/morg2smiles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that need a prepared dataset shard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]
